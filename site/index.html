<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的技术博客 · iOS 逆向与开发笔记</title>
<meta name="description" content="记录 iOS Tweak 开发、逆向分析与前端、后端、AI 等技术方向的思考与沉淀。">
<script>
(function () {
  try {
    var mode = localStorage.getItem('blog-theme-mode');
    if (!mode) {
      var old = localStorage.getItem('blog-theme');
      mode = (old === 'light' || old === 'dark') ? old : 'system';
    }
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var html = document.documentElement;
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    html.setAttribute('data-theme-mode', mode);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap inner">
    <a class="brand" href="index.html">我的技术博客</a>
    <nav class="nav">
      <a href="index.html">文章</a>
      <a href="#about">关于</a>
      <a href="write.html">写作</a>
      <div class="theme-switch" id="theme-switch" role="group" aria-label="主题模式">
        <button type="button" data-mode="light" aria-label="浅色模式" title="浅色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
        <button type="button" data-mode="dark" aria-label="深色模式" title="深色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button type="button" data-mode="system" aria-label="跟随系统" title="跟随系统"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Notes on Development</p>
    <h1>慢一点读代码，<br>快一点理解系统。</h1>
    <p>这里记录 iOS Tweak 开发、逆向分析，以及前端、后端、AI 与工程实践中的笔记。不追求完整，只希望每一次记录都足够具体。</p>
  </section>

  <p class="section-label">最近文章</p>

  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="搜索标题或摘要…" aria-label="搜索文章">
    <div class="chips" id="chips"></div>
  </div>

  <ul class="post-list" id="post-list">
    <li><p class="list-hint">正在加载文章…</p></li>
  </ul>

  <noscript>
    <p class="list-hint">本页需要启用 JavaScript 才能加载文章列表。</p>
  </noscript>

  <section class="about" id="about">
    <h2>关于本博客</h2>
    <p>一个纯粹的笔记站点。文章以 Markdown 存放在 content/posts，构建时编译成 posts.json；首页与文章页由同一份数据渲染。写新文章可以用站内写作台导出 Markdown，也可以直接新增 md 文件后重新构建部署。</p>
  </section>
</main>

<footer class="site-footer wrap">
  <span>© 2026 我的技术博客</span>
  <span>共 <span id="post-count">—</span> 篇文章</span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
